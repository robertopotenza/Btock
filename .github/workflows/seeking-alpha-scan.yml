# Seeking Alpha -> Btock -> Gmail cloud workflow.
#
# INACTIVE BY DESIGN: this workflow is manual-dispatch only (no `schedule:`
# trigger). A live Seeking Alpha scan is currently blocked by Seeking
# Alpha's PerimeterX bot protection (a 403 CAPTCHA wall hit headless
# Chromium before any login was attempted -- see scripts/sa_scraper.py's
# docstring and the PR description). Do not add a `schedule:` trigger until
# a policy-compliant way to read Seeking Alpha's article-level author
# ratings is confirmed working end to end; see the PR/README for the
# required secrets first.
#
# Required repository secrets (set these in GitHub, never in chat):
#   GMAIL_SENDER_ADDRESS   Gmail address to send the report from
#   GMAIL_APP_PASSWORD     Gmail App Password for that address
#                           (https://myaccount.google.com/apppasswords)
#   SA_STORAGE_STATE_B64   (only once live SA access is possible) a
#                           base64-encoded Playwright storage_state JSON,
#                           exported from an already signed-in browser --
#                           see scripts/sa_scraper.py's docstring.

name: Seeking Alpha CLOUD scan

on:
  workflow_dispatch:
    inputs:
      cutoff_et:
        description: "Wall-clock ET cutoff, e.g. 2026-09-25T09:00:00 (blank = today 09:00 ET)"
        required: false
      test:
        description: "Send as a test run (subject prefix, -test run id suffix)"
        type: boolean
        default: true
      dry_run:
        description: "Compute everything but do not send the email"
        type: boolean
        default: false
      manual_coverage_file:
        description: "Repo-relative path to a manual coverage JSON, for testing the Btock+email leg while live SA scraping is blocked"
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run orchestrator
        env:
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SA_STORAGE_STATE_B64: ${{ secrets.SA_STORAGE_STATE_B64 }}
        run: |
          set -eu
          ARGS="--results-dir results --cache-dir ${RUNNER_TEMP}/btock-cache --ttl 900"
          if [ -n "${{ inputs.cutoff_et }}" ]; then
            ARGS="$ARGS --cutoff-et ${{ inputs.cutoff_et }}"
          fi
          if [ "${{ inputs.test }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.manual_coverage_file }}" ]; then
            ARGS="$ARGS --manual-coverage-file ${{ inputs.manual_coverage_file }}"
          elif [ -n "${SA_STORAGE_STATE_B64:-}" ]; then
            ARGS="$ARGS --storage-state SA_STORAGE_STATE_B64"
          fi
          python scripts/orchestrate.py $ARGS

      - name: Commit dated result record (durable storage)
        run: |
          set -eu
          git config user.name "btock-cloud-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "Btock cloud scan result $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No result changes to commit"
          fi

      - name: Upload result record as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: btock-results
          path: results/
          retention-days: 90
